<head>

  <style>
    :root {
      --gold:#C9A84C; --gold-dim:rgba(201,168,76,.1); --gold-border:rgba(201,168,76,.35);
      --cream:#FAF8F4; --cream-2:#F4F1EB;
      --ink:#1C1C1C; --ink-3:#444;
      --rule:rgba(0,0,0,.12); --rule-heavy:rgba(0,0,0,.22);
      --text-muted:#666; --sand:#E8DDD0;
      --header-h:56px; --card-h:58vh;
    }
    *,::before,::after { box-sizing:border-box; margin:0; padding:0; }
    html { height:100%; }
    body { height:100%; background:#1a1a1a; font-family:'Source Serif 4',Georgia,serif; overflow:hidden; }

    /* Rule 1 */
    #map { position:fixed; inset:0; z-index:0; }

    /* ── Header ── */
    header {
      position:fixed; top:0; left:0; right:0; height:var(--header-h); z-index:100;
      background:rgba(255,255,255,.97); border-bottom:2px solid var(--ink);
      display:flex; align-items:center; justify-content:space-between; padding:0 20px;
    }
    .logo-wrap { display:flex; align-items:center; gap:10px; text-decoration:none; }
    .logo-addr { font-family:'DM Mono',monospace; font-size:.45rem; letter-spacing:.12em;
                 text-transform:uppercase; color:var(--text-muted);
                 border-left:1px solid var(--sand); padding-left:10px; }
    #sku-badge {
      font-family:'DM Mono',monospace; font-size:.42rem; letter-spacing:.14em;
      text-transform:uppercase; color:var(--gold);
      background:var(--gold-dim); border:1px solid var(--gold-border);
      padding:4px 10px; border-radius:2px;
    }

    /* ── Place card — anchored to bottom ── */
    #place-card {
      position:fixed; bottom:0; left:0; right:0;
      height:var(--card-h);
      background:var(--cream); border-top:2px solid var(--ink);
      border-radius:12px 12px 0 0;
      box-shadow:0 -8px 40px rgba(0,0,0,.28);
      z-index:50; display:flex; flex-direction:column;
      overflow:hidden;
    }

    /* drag handle feel */
    .card-handle {
      width:36px; height:4px; background:var(--sand);
      border-radius:2px; margin:10px auto 0;
      flex-shrink:0;
    }

    .card-scroll { flex:1; overflow-y:auto; padding:12px 20px 24px; }

    /* ── SKU / parent row ── */
    .card-meta {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:10px; flex-wrap:wrap; gap:6px;
    }
    #place-sku {
      font-family:'DM Mono',monospace; font-size:.38rem; letter-spacing:.16em;
      text-transform:uppercase; color:var(--gold);
    }
    #back-link {
      font-family:'DM Mono',monospace; font-size:.38rem; letter-spacing:.1em;
      text-transform:uppercase; color:var(--text-muted); text-decoration:none;
    }
    #back-link:hover { color:var(--ink); }

    /* ── Heart + category ── */
    .card-tags { display:flex; gap:6px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
    #place-heart {
      background:var(--gold); color:#fff; font-size:.38rem;
      font-family:'DM Mono',monospace; letter-spacing:.1em; text-transform:uppercase;
      padding:3px 8px; border-radius:20px;
    }
    #place-cat {
      background:var(--cream-2); border:1px solid var(--rule);
      font-family:'DM Mono',monospace; font-size:.38rem; letter-spacing:.1em;
      text-transform:uppercase; color:var(--ink-3);
      padding:3px 8px; border-radius:3px;
    }

    /* ── Name + address ── */
    #place-name { font-size:1.35rem; font-weight:600; color:var(--ink); line-height:1.2; margin-bottom:4px; }
    #place-addr { font-family:'DM Mono',monospace; font-size:.42rem; color:var(--text-muted);
                  letter-spacing:.06em; margin-bottom:14px; }

    /* ── Specs row ── */
    #place-specs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
    .spec-pill {
      background:var(--cream-2); border:1px solid var(--rule); border-radius:3px;
      padding:5px 10px; font-family:'DM Mono',monospace; font-size:.4rem;
      letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);
    }
    .spec-pill.pending { color:var(--text-muted); border-style:dashed; }

    /* ── Actions ── */
    #place-actions { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .place-btn {
      padding:9px 16px; border-radius:3px; font-family:'DM Mono',monospace;
      font-size:.42rem; letter-spacing:.1em; text-transform:uppercase;
      text-decoration:none; border:none; cursor:pointer; flex-shrink:0;
    }
    .btn-waymo  { background:#1A73E8; color:#fff; }
    .btn-yt     { background:#FF0000; color:#fff; }
    .btn-yelp   { background:#d32323; color:#fff; }
    .btn-maps   { background:var(--ink); color:var(--cream); }

    #place-yt { width:100%; aspect-ratio:16/9; border:none; display:none; border-radius:3px; }

    /* ── Not-found state ── */
    #not-found {
      position:fixed; inset:0; display:none; align-items:center; justify-content:center;
      background:var(--cream); z-index:200; flex-direction:column; gap:12px;
    }
    #not-found h2 { font-size:1.2rem; color:var(--ink); }
    #not-found p  { font-family:'DM Mono',monospace; font-size:.42rem; color:var(--text-muted); }
    #not-found a  { font-family:'DM Mono',monospace; font-size:.42rem; color:var(--gold); }

    /* ── Heart map marker ── */
    .heart-pin {
      background:var(--gold); color:#fff; padding:5px 10px; border-radius:20px;
      font-family:'Source Serif 4',serif; font-size:11px; font-weight:600;
      white-space:nowrap; box-shadow:0 2px 12px rgba(0,0,0,.3);
      display:flex; align-items:center; gap:4px;
    }
  </style>
</head>

/* ── Boot: read ?id= slug ─────────────────────────────────────────── */
const slug  = new URLSearchParams(location.search).get('id') || '';
const place = PLACES[slug];

if (!place) {
  document.getElementById('not-found').style.display = 'flex';
  document.getElementById('place-card').style.display = 'none';
} else {
  document.title = `${place.name} · ${place.sku} — Requation`;
  document.getElementById('sku-badge').textContent    = place.sku;
  document.getElementById('logo-addr').textContent    = place.parent + ' · ' + place.cat;
  document.getElementById('place-sku').textContent    = place.sku;
  document.getElementById('back-link').textContent    = '← ' + place.parent;
  document.getElementById('back-link').href           = place.parentUrl;
  document.getElementById('place-name').textContent   = place.name;
  document.getElementById('place-addr').textContent   = place.addr;
  document.getElementById('place-cat').textContent    = place.cat;
  if (place.heart) document.getElementById('place-heart').style.display = 'inline-block';

  const act = document.getElementById('place-actions');
  if (place.waymo) {
    const w = Object.assign(document.createElement('a'), { className:'place-btn btn-waymo', textContent:'Waymo One →', href:place.waymo, target:'_blank' });
    act.appendChild(w);
  }
  const yt = document.createElement('button');
  yt.className = 'place-btn btn-yt'; yt.textContent = '▶ YouTube';
  yt.onclick = () => {
    const f = document.getElementById('place-yt');
    f.style.display = 'block';
    f.src = 'https://www.youtube.com/embed?listType=search&list=' + encodeURIComponent(place.ytSearch) + '&autoplay=1';
  };
  act.appendChild(yt);

  /* Yelp button — live when Yelp data populated */
  const yelp = Object.assign(document.createElement('button'), { className:'place-btn btn-maps', textContent:'Maps →' });
  yelp.onclick = () => window.open('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(place.addr), '_blank');
  act.appendChild(yelp);
}

/* ── Rule 3: map singleton centered on place ── */
async function initMap() {
  const { Map }                   = await google.maps.importLibrary('maps');
  const { AdvancedMarkerElement } = await google.maps.importLibrary('marker');

  const center = place
    ? { lat: place.lat, lng: place.lng }
    : { lat: 34.0457, lng: -118.2586 };

  const map = new Map(document.getElementById('map'), {
    center, zoom: 18, tilt: 45,
    mapId: '96844e6a7bb74a7d5514d3a5',
    gestureHandling: 'greedy',
  });

  if (place) {
    const el = document.createElement('div');
    el.className = 'heart-pin';
    el.innerHTML = '♥ ' + place.name;
    new AdvancedMarkerElement({ position: center, map, content: el, title: place.name });
  }
}
window.initMap = initMap;
</script>

<script async
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD7UMA5ILPXv9QK2_gvxPVth30MavRd2WQ&callback=initMap&libraries=marker&v=weekly">
</script>
