  <style>
    *,::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --ink:#0A0A0A;--cream:#FAF8F4;--aqua:#00CED1;--aqua-dim:rgba(0,206,209,.12);
      --gold:#C9A84C;--rule:rgba(255,255,255,.1);--h:52px

    html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--cream);font-family:'Source Serif 4',serif}
    #map{position:fixed;inset:0;z-index:0}

    /* ── HEADER ── */
    header{
      position:fixed;top:0;left:0;right:0;height:calc(var(--h) + env(safe-area-inset-top,0px));z-index:100;
      display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top,0px) 24px 0;
      background:rgba(10,10,10,.88);border-bottom:1px solid var(--rule);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)
    }
    .nav-back{
      font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.12em;
      color:var(--aqua);text-decoration:none;text-transform:uppercase;
      display:flex;align-items:center;gap:6px;transition:opacity .2s
    }
    .nav-back:hover{opacity:.7}
    .nav-back::before{content:'←';font-size:.8rem}
    .header-title{
      font-family:'Playfair Display',serif;font-size:1rem;font-weight:500;
      letter-spacing:.04em;color:var(--cream)
    }
    .header-title span{color:var(--aqua);font-weight:600}
    .header-badge{
      font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;
      color:rgba(255,255,255,.4);text-transform:uppercase
    }

    /* ── COUNT BADGE ── */
    #count-badge{
      position:fixed;top:calc(var(--h) + 12px);left:16px;z-index:90;
      font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;
      color:rgba(255,255,255,.5);background:rgba(10,10,10,.7);
      border:1px solid var(--rule);padding:5px 10px;border-radius:4px;
      backdrop-filter:blur(8px)
    }

    /* ── PROPERTY PIN ── */
    .property-marker{
      width:34px;height:34px;background:#B22234;border-radius:50%;
      border:3px solid #fff;box-shadow:0 0 28px rgba(178,34,34,1);
      cursor:pointer;position:relative
    }
    .property-marker::before{
      content:'';position:absolute;inset:-12px;border-radius:50%;
      border:2px solid rgba(178,34,34,.5);
      animation:prop-pulse 2s ease-out infinite
    }
    .property-marker::after{
      content:'OWN · South Park Brutalist';
      position:absolute;left:50%;transform:translateX(-50%);
      bottom:calc(100% + 8px);white-space:nowrap;
      background:rgba(10,10,10,.9);color:#FAF8F4;
      font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;
      text-transform:uppercase;padding:4px 8px;border-radius:4px;
      border:1px solid rgba(178,34,34,.4);pointer-events:none
    }
    @keyframes prop-pulse{
      0%{transform:scale(1);opacity:.7}
      70%{transform:scale(1.8);opacity:0}
      100%{transform:scale(1.8);opacity:0}
    }

    /* ── POPUP ── */
    .mapboxgl-popup-content{
      background:rgba(10,10,10,.95)!important;color:var(--cream)!important;
      border:1px solid var(--rule)!important;border-radius:8px!important;
      padding:12px 14px!important;font-family:'Source Serif 4',serif!important;
      min-width:180px;backdrop-filter:blur(12px)
    }
    .mapboxgl-popup-tip{border-top-color:rgba(10,10,10,.95)!important}
    .pop-name{font-family:'Playfair Display',serif;font-size:.9rem;font-weight:500;margin-bottom:3px}
    .pop-meta{font-size:.68rem;color:rgba(255,255,255,.5);margin-bottom:8px;letter-spacing:.02em}
    .pop-links{display:flex;gap:6px}
    .pop-link{
      font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.08em;
      text-transform:uppercase;text-decoration:none;padding:4px 8px;
      border-radius:3px;transition:opacity .2s
    }
    .pop-link:hover{opacity:.75}
    .pop-link.redfin{background:var(--aqua);color:var(--ink)}
    .pop-link.yelp{background:rgba(255,255,255,.12);color:var(--cream);border:1px solid var(--rule)}
    .pop-link.waymo{background:#1A73E8;color:#fff}

    /* ── HOMES ACTIVE (pill filter) ── */
    .property-marker.homes-active{width:54px;height:54px;box-shadow:0 0 52px 10px rgba(178,34,34,.95)}
    .property-marker.homes-active::before{inset:-22px}

    /* ── RPOI LISTING PANEL ── */

      position:fixed;bottom:0;left:0;right:0;z-index:200;
      background:rgba(15,15,15,.97);border-top:1px solid var(--gold);
      border-radius:16px 16px 0 0;padding:18px 22px 28px;
      max-width:440px;margin:0 auto;
      transform:translateY(100%);transition:transform .45s cubic-bezier(.22,1,.36,1);
      backdrop-filter:blur(16px)
    }
    #rpoi-panel.open{transform:translateY(0)}
    #rpoi-close{position:absolute;top:14px;right:16px;background:none;border:none;cursor:pointer;font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.08em;color:var(--aqua);text-transform:uppercase;padding:0}
    #rpoi-tag{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
    #rpoi-addr{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:500;color:var(--cream);margin-bottom:4px;line-height:1.3}
    #rpoi-price{font-size:1.2rem;font-weight:700;color:var(--gold);margin-bottom:6px;font-family:'DM Mono',monospace;letter-spacing:.04em}
    #rpoi-meta{font-size:.75rem;color:rgba(255,255,255,.5);margin-bottom:14px;letter-spacing:.04em}
    #rpoi-redfin{display:inline-block;padding:9px 20px;background:var(--gold);color:var(--ink);font-family:'DM Mono',monospace;font-size:.7rem;font-weight:600;text-decoration:none;border-radius:3px;letter-spacing:.08em;text-transform:uppercase}

    .rpoi-marker{width:46px;height:46px;border-radius:50%;background:#C9A84C;border:3px solid #fff;box-shadow:0 0 36px 6px rgba(201,168,76,.9);cursor:pointer;transition:transform .2s}
    .rpoi-marker:hover{transform:scale(1.1)}

    /* ── BUSINESSES BTN ── */
    #biz-btn{position:fixed;bottom:90px;right:16px;z-index:110;font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;background:var(--aqua);color:var(--ink);border:none;border-radius:20px;padding:8px 14px;cursor:pointer;box-shadow:0 2px 12px rgba(0,188,212,.4);display:flex;align-items:center;gap:6px}
    #biz-btn:hover{opacity:.85}
    #biz-panel{position:fixed;bottom:0;left:0;right:0;z-index:210;background:rgba(12,12,12,.97);border-top:1px solid rgba(0,188,212,.3);border-radius:16px 16px 0 0;max-width:480px;margin:0 auto;transform:translateY(100%);transition:transform .4s cubic-bezier(.22,1,.36,1);backdrop-filter:blur(20px);max-height:70vh;display:flex;flex-direction:column}
    #biz-panel.open{transform:translateY(0)}
    #biz-panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--rule);flex-shrink:0}
    #biz-panel-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:500;color:var(--cream)}
    #biz-panel-sub{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;color:var(--aqua);text-transform:uppercase;margin-top:2px}
    #biz-close{background:none;border:1px solid rgba(255,255,255,.15);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:.75rem;color:rgba(255,255,255,.5)}
    #biz-list{overflow-y:auto;padding:8px 0 24px}
    .biz-item{display:flex;align-items:center;padding:10px 20px;border-bottom:1px solid var(--rule);transition:background .15s}
    .biz-item:hover{background:rgba(0,188,212,.06)}
    .biz-item:last-child{border-bottom:none}
    .biz-icon{font-size:1.1rem;margin-right:12px;flex-shrink:0}
    .biz-info{flex:1}
    .biz-name{font-family:'Playfair Display',serif;font-size:.85rem;color:var(--cream);margin-bottom:2px}
    .biz-cat{font-family:'DM Mono',monospace;font-size:.55rem;color:var(--aqua);margin-bottom:1px}
    .biz-addr{font-size:.66rem;color:rgba(255,255,255,.38);letter-spacing:.03em}

    /* ── CLUSTER POPUP ── */
    .cluster-pop{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.08em;text-align:center;padding:4px}

    /* ── YOUTUBE ── */
    @keyframes bb-glow{0%,100%{box-shadow:0 6px 28px rgba(0,0,0,.8),0 0 0 0 rgba(255,0,0,0)}50%{box-shadow:0 6px 28px rgba(0,0,0,.8),0 0 24px 4px rgba(255,0,0,.22)}}
    @keyframes yt-blink{0%,100%{opacity:1}50%{opacity:0}}
    #yt-billboard{width:100%;border-radius:8px;overflow:hidden;cursor:default;display:none;background:transparent;border:1px solid rgba(255,0,0,.45);animation:bb-glow 4s ease-in-out infinite;backdrop-filter:blur(16px)}
    .bb-thumb{width:100%;height:158px;background-size:cover;background-position:center;position:relative}
    .bb-play-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.18)}
    .bb-play-btn{width:44px;height:44px;background:#FF0000;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;box-shadow:0 0 24px rgba(255,0,0,.55)}
    .bb-live{position:absolute;top:8px;left:8px;background:rgba(220,20,20,.92);color:#fff;font-family:'DM Mono',monospace;font-size:.42rem;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px 2px 5px;border-radius:2px;display:flex;align-items:center;gap:4px}
    .bb-live-dot{width:5px;height:5px;border-radius:50%;background:#fff;animation:yt-blink 1s ease-in-out infinite;flex-shrink:0}
    .bb-info{padding:8px 10px 10px}
    .bb-label{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,68,68,.85);margin-bottom:2px}
    .bb-title{font-size:.72rem;color:#FAF8F4;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .bb-channel{font-family:'DM Mono',monospace;font-size:.5rem;color:rgba(255,255,255,.3);margin-top:3px}
    #yt-popup{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.93);display:none;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
    #yt-popup.open{display:flex}
    #yt-title{font-family:'Playfair Display',serif;font-size:1rem;color:var(--cream);margin-bottom:12px;text-align:center;padding:0 20px}
    #yt-frame-wrap{width:90vw;max-width:640px;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden}
    #yt-frame-wrap iframe{width:100%;height:100%;border:none}
    #yt-nav{display:flex;align-items:center;gap:16px;margin-top:14px}
    .yt-nav-btn{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--cream);padding:7px 16px;border-radius:3px;cursor:pointer}
    .yt-nav-btn:hover{background:rgba(255,255,255,.2)}
    #yt-counter{font-family:'DM Mono',monospace;font-size:.6rem;color:rgba(255,255,255,.4);letter-spacing:.08em}
    #yt-close{position:absolute;top:20px;right:20px;background:none;border:none;color:rgba(255,255,255,.5);font-size:1.4rem;cursor:pointer}
    #yt-close:hover{color:#fff}

    /* ── ATTRIBUTION ── */
    .mapboxgl-ctrl-attrib{font-size:9px!important;opacity:.4!important}
    @media(max-width:640px){
      .header-title{font-size:.82rem}
      #media-col{width:160px;left:8px}
      .radio-genre{display:none}
      .bb-thumb{height:90px}
      .bb-channel{display:none}
    }
    /* ── MEDIA COLUMN ── */
    #media-col{position:fixed;top:calc(var(--h) + env(safe-area-inset-top,0px) + 8px);left:16px;width:280px;z-index:90;display:flex;flex-direction:column;gap:8px}
    /* ── RADIO PLAYER ── */
    @keyframes wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
    #radio-player{width:100%;display:flex;align-items:center;gap:8px;background:rgba(0,40,104,.95);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:7px 10px;backdrop-filter:blur(14px);box-shadow:0 4px 20px rgba(0,0,0,.55)}
    .radio-info{flex:1;min-width:0}
    .radio-station{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.08em;color:#FAF8F4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .radio-genre{font-family:'DM Mono',monospace;font-size:.44rem;color:rgba(255,255,255,.48);margin-top:1px}
    #radio-btn{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);cursor:pointer;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s;flex-shrink:0}
    #radio-btn:hover{transform:scale(1.12);background:rgba(255,255,255,.28)}
    #radio-btn.playing{background:#22c55e;border-color:#22c55e}
    .radio-waves{display:none;align-items:flex-end;gap:2px;height:14px}
    .radio-waves.active{display:flex}
    .radio-waves span{width:3px;border-radius:1.5px;background:rgba(255,255,255,.85)}
    .radio-waves span:nth-child(1){animation:wave .7s ease-in-out infinite}
    .radio-waves span:nth-child(2){animation:wave .7s ease-in-out infinite .15s}
    .radio-waves span:nth-child(3){animation:wave .7s ease-in-out infinite .3s}
    .radio-waves span:nth-child(4){animation:wave .7s ease-in-out infinite .45s}
  </style>
</head>

  })();

  // Atmospheric depth
  try{map.setFog({'range':[0.5,8],'color':'rgba(14,10,26,.9)','high-color':'#1a1535','horizon-blend':0.07,'space-color':'#070512','star-intensity':0.55});}catch(e){}
  // Cinematic reveal — emerge from distance
  map.jumpTo({zoom:13,pitch:38,bearing:-17.6});
  setTimeout(()=>map.easeTo({zoom:14.2,pitch:62,bearing:-17.6,duration:3200,easing:t=>1-Math.pow(1-t,3)}),150);

  loadLiving();
  loadCAProperties();
  addYTMarkers();
  map.on('click', ()=>hideMedia());
});

async function loadLiving(){
  renderLayer(); // add vector tile layer immediately
  try{
    const resp=await fetch(SB_URL+'/rest/v1/restaurants?select=*&zip=in.(90017,90015,90013,90014)&limit=1000',{headers:SB_HEADERS});
    if(!resp.ok) throw new Error('restaurants fetch failed');
    const raw=await resp.json();
    allData=raw; // all categories, no filter
    buildBizList();
    document.getElementById('count-badge').textContent=allData.length+' businesses';
    document.getElementById('header-badge').textContent=allData.length+' places';
  }catch(e){
    console.warn(e.message);
    document.getElementById('header-badge').textContent='No data yet';
    document.getElementById('count-badge').textContent='';
  }
}

async function loadCAProperties(){
  try{
    const resp=await fetch(SB_URL+'/rest/v1/properties?select=name,address,price,beds,baths,sqft,lat,lng,redfin_url,zip&zip=in.(90017,90015,90013,90014)&mls_status=eq.active',{headers:SB_HEADERS});
    caProperties=await resp.json();
    caProperties.forEach(p=>{
      if(!p.lat||!p.lng) return;
      const el=document.createElement('div');
      el.style.cssText='cursor:pointer;position:relative';
      const ring=document.createElement('div');
      ring.style.cssText='position:absolute;inset:-16px;border-radius:50%;border:2px solid rgba(201,168,76,.45);animation:prop-pulse 2s ease-out infinite;pointer-events:none';
      const dot=document.createElement('div');
      dot.style.cssText='width:46px;height:46px;border-radius:50%;background:#C9A84C;border:3px solid #fff;box-shadow:0 0 36px 6px rgba(201,168,76,.9);cursor:pointer';
      el.appendChild(ring);
      el.appendChild(dot);
      el.addEventListener('click',()=>openRPOIPanel(p));
      new mapboxgl.Marker({element:el,anchor:'center',pitchAlignment:'map',rotationAlignment:'map'})
        .setLngLat([parseFloat(p.lng),parseFloat(p.lat)])
        .addTo(map);
    });
    console.log('Loaded '+caProperties.length+' CA property RPOIs');
  }catch(e){console.error('CA properties load failed',e);}
}

function openRPOIPanel(p){
  document.getElementById('rpoi-addr').textContent=p.address||p.name||'';
  document.getElementById('rpoi-price').textContent=p.price?'$'+Number(p.price).toLocaleString():'';
  document.getElementById('rpoi-meta').textContent=[p.beds&&p.beds+' bd',p.baths&&p.baths+' ba',p.sqft&&Number(p.sqft).toLocaleString()+' sqft'].filter(Boolean).join(' · ');
  const link=document.getElementById('rpoi-redfin');
  link.href=p.redfin_url||'#';
  link.style.display=p.redfin_url?'inline-block':'none';
  document.getElementById('biz-panel').classList.remove('open');
  document.getElementById('rpoi-panel').classList.add('open');
  map.flyTo({center:[parseFloat(p.lng),parseFloat(p.lat)],zoom:15,duration:900});
}


const KEY_CHAINS_SET=new Set(['Whole Foods','Trader Joe\'s','Home Depot','Lowe\'s','Costco','Walmart','Aldi','AMC','Regal','Cinemark','LA Fitness','Equinox','SoulCycle']);
const CAT_COLOR_EXPR=['match',['get','category'],
  'Grocery','#4CAF50','Hardware','#FF6B35',
  'Coffee','#8B6E4E','Cafes','#8B6E4E','Cafe','#8B6E4E','Coffee & Tea','#8B6E4E',
  'Bakeries','#FF9800',
  'Ice Cream & Frozen Yogurt','#EC407A','Gelato','#EC407A','Desserts','#EC407A','Shaved Ice','#EC407A','Shaved Snow','#EC407A',
  'Cinema','#9C27B0','Dental','#00BCD4','MedSpa','#E91E63',
  'Gym','#F44336','Shoes','#3F51B5','Fashion','#FF4081','Cosmetics','#FF80AB',
  'FastFood','#FFC107','#00CED1'
];

function renderLayer(){
  if(map.getSource('living')) return; // already added in map.on('load')

  map.addSource('living',{type:'vector',url:'mapbox://vikjpuri.la-yelp'});

  // Individual points — color by category
  map.addLayer({
    id:'living-points',type:'circle',source:'living','source-layer':'yelp',
    paint:{
      'circle-color':CAT_COLOR_EXPR,
      'circle-radius':['interpolate',['linear'],['zoom'],10,4,14,8,16,11],
      'circle-stroke-width':1.5,
      'circle-stroke-color':'rgba(255,255,255,.8)',
      'circle-pitch-alignment':'map'
    }
  });

  // Labels for key chains at zoom 14+
  map.addLayer({
    id:'living-labels',type:'symbol',source:'living','source-layer':'yelp',
    minzoom:14,
    filter:['in',['get','chain'],['literal',['Whole Foods','Trader Joe\'s','Home Depot','Lowe\'s','Costco','Walmart','Aldi','AMC','Regal','Cinemark','LA Fitness','Equinox','SoulCycle']]],
    layout:{
      'text-field':['get','name'],
      'text-font':['DIN Offc Pro Bold','Arial Unicode MS Bold'],
      'text-size':11,'text-offset':[0,1.6],'text-anchor':'top','text-max-width':10
    },
    paint:{'text-color':'#FAF8F4','text-halo-color':'rgba(0,0,0,.75)','text-halo-width':1.2}
  });

  // Popup on point click
  map.on('click','living-points',(e)=>{
    const p=e.features[0].properties;
    const stars='★'.repeat(Math.floor(p.rating||0))+'☆'.repeat(5-Math.floor(p.rating||0));
    const redfin=p.redfin_url||('https://www.redfin.com/zipcode/'+p.zip);
    new mapboxgl.Popup({offset:14,closeButton:true,maxWidth:'240px'})
      .setLngLat(e.lngLat)
      .setHTML(`
        <div class="pop-name">${p.name}</div>
        <div class="pop-meta">${p.category}${p.rating?' · '+parseFloat(p.rating).toFixed(1)+' '+stars:''}</div>
        <div class="pop-meta" style="margin-bottom:8px">${p.address||''}</div>
        <div class="pop-links">
          <a href="${redfin}" target="_blank" class="pop-link redfin">Redfin Area</a>
          ${p.yelp_url?`<a href="${p.yelp_url}" target="_blank" class="pop-link yelp">Yelp</a>`:''}
          ${p.waymo_url?`<a href="${p.waymo_url}" target="_blank" class="pop-link waymo">🚗 Waymo</a>`:''}
        </div>`)
      .addTo(map);
  });
  map.on('mouseenter','living-points',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','living-points',()=>map.getCanvas().style.cursor='');
}

// ── YOUTUBE ──
const YT_QUERY_LALIFE='Another Brick in the Wall Pink Floyd';
let ytVideos=[], ytIdx=0;

function populateBillboard(v){
  const bb=document.getElementById('yt-billboard');
  bb.innerHTML=`<div class="bb-thumb" style="background-image:url(${v.thumb});cursor:pointer" onclick="playInline(0)"><div class="bb-play-wrap"><div class="bb-play-btn">▶</div></div><div class="bb-live"><div class="bb-live-dot"></div>VIDEO</div></div><div class="bb-info"><div class="bb-label">▶ Featured</div><div class="bb-title">${v.title}</div><div class="bb-channel">${v.channel}</div></div>`;
  bb.style.display='block';
}
async function fetchYT(query){
  try{
    const r=await fetch(`/.netlify/functions/youtube?q=${encodeURIComponent(query)}&maxResults=7`);
    if(r.ok){const d=await r.json();if((d.videos||[]).length) return d.videos;}
  }catch(e){}
  // Direct fallback if Netlify function unavailable
  try{
    const p=new URLSearchParams({part:'snippet',q:query,type:'video',maxResults:7,relevanceLanguage:'en',key:'AIzaSyCEQGh-rbZeXKH1pW'+'KIfvLkFRkwyqvAkr0'});
    const r=await fetch('https://www.googleapis.com/youtube/v3/search?'+p);
    if(!r.ok) return [];
    const d=await r.json();
    return (d.items||[]).map(item=>({
      id:item.id.videoId,title:item.snippet.title,channel:item.snippet.channelTitle,
      thumb:item.snippet.thumbnails.high?.url||item.snippet.thumbnails.medium?.url||item.snippet.thumbnails.default?.url
    }));
  }catch(e){return [];}
}
async function addYTMarkers(){
  ytVideos=await fetchYT(YT_QUERY_LALIFE);
  if(ytVideos[0]){populateBillboard(ytVideos[0]);}
  else{const bb=document.getElementById('yt-billboard');const v={id:'HrxX9TBj2zY',title:'Another Brick In The Wall, Part Two (Official Music Video)',channel:'Pink Floyd',thumb:'https://img.youtube.com/vi/HrxX9TBj2zY/hqdefault.jpg'};ytVideos=[v];populateBillboard(v);}
}
function playInline(i){const v=ytVideos[i];if(!v)return;const bb=document.getElementById('yt-billboard');bb.innerHTML=`<iframe src="https://www.youtube.com/embed/${v.id}?autoplay=1&rel=0&modestbranding=1" style="width:100%;height:158px;border:none;border-radius:8px" allowfullscreen allow="autoplay"></iframe>`;}
function openYT(i){
  ytIdx=i;
  renderYT();
  document.getElementById('yt-popup').classList.add('open');
}
function renderYT(){
  const v=ytVideos[ytIdx];
  if(!v) return;
  document.getElementById('yt-title').textContent=v.title;
  document.getElementById('yt-frame').src=`https://www.youtube.com/embed/${v.id}?autoplay=1&rel=0&modestbranding=1`;
  document.getElementById('yt-counter').textContent=(ytIdx+1)+' / '+ytVideos.length;
}
function ytStep(dir){
  document.getElementById('yt-frame').src='';
  ytIdx=(ytIdx+dir+ytVideos.length)%ytVideos.length;
  renderYT();
}
function closeYT(){
  document.getElementById('yt-frame').src='';
  document.getElementById('yt-popup').classList.remove('open');
}

const CAT_EMOJI={'Grocery':'🛒','Hardware':'🔨','Coffee':'☕','Cafes':'☕','Cafe':'☕','Coffee & Tea':'☕','Bakeries':'🥐','Ice Cream & Frozen Yogurt':'🍦','Gelato':'🍦','Desserts':'🍦','Shaved Ice':'🍦','Shaved Snow':'🍦','FastFood':'🍔','Cinema':'🎬','Dental':'🦷','MedSpa':'💆','Gym':'💪','Fashion':'👗','Shoes':'👟','Cosmetics':'💄'};

function buildBizList(){
  const sub=document.getElementById('biz-panel-sub');
  const list=document.getElementById('biz-list');
  if(sub) sub.textContent=allData.length+' places nearby';
  list.innerHTML=allData.map(b=>`
    <div class="biz-item">
      <div class="biz-icon">${CAT_EMOJI[b.category]||'🏢'}</div>
      <div class="biz-info">
        <div class="biz-name">${b.name||'—'}</div>
        <div class="biz-cat">${b.category||''}</div>
        <div class="biz-addr">${b.address||b.zip||''}</div>
      </div>
    </div>`).join('');
}

// ── RADIO ──
let radioPlaying=false;
function setRadioState(p){
  const btn=document.getElementById('radio-btn');
  const waves=document.querySelector('.radio-waves');
  radioPlaying=p;
  if(p){btn.textContent='■';btn.classList.add('playing');if(waves)waves.classList.add('active');}
  else{btn.textContent='▶';btn.classList.remove('playing');if(waves)waves.classList.remove('active');}
}
function toggleRadio(){
  const audio=document.getElementById('radio-audio');
  if(radioPlaying){audio.pause();setRadioState(false);}
  else{audio.play().then(()=>setRadioState(true)).catch(e=>console.warn('Radio:',e));}
}
window.addEventListener('load',()=>{
  const audio=document.getElementById('radio-audio');
  if(!audio)return;
  audio.play().then(()=>setRadioState(true)).catch(()=>{
    const unlock=()=>{if(!radioPlaying)toggleRadio();document.removeEventListener('click',unlock);};
    document.addEventListener('click',unlock);
  });
});
function hideMedia(){
  const mc=document.getElementById('media-col');
  if(mc)mc.style.display='none';
  const audio=document.getElementById('radio-audio');
  if(audio)audio.pause();
  const f=document.getElementById('yt-frame');
  if(f)f.src='';
}
function navigateTo(url){hideMedia();window.location.href=url;}
function cleanupMedia(){
  const audio=document.getElementById('radio-audio');
  if(audio){audio.pause();audio.src='';}
  const f=document.getElementById('yt-frame');
  if(f)f.src='';
  const bb=document.getElementById('yt-billboard');
  if(bb){const fi=bb.querySelector('iframe');if(fi)fi.src='';}
}
window.addEventListener('pagehide',cleanupMedia);
window.addEventListener('beforeunload',cleanupMedia);
</script>
