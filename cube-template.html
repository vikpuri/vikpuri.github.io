<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Claude's Cube — Directory Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,700;1,700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --ink:#1c1c1c; --ink-3:#3a3a3a; --cream:#faf8f4; --cream-2:#f3f0ea;
    --sand:#e8e3d8; --rule:#ddd8cc; --rule-heavy:#bfb8a8;
    --gold:#c9a84c; --text-muted:#888;
  }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; font-family:'Source Serif 4',Georgia,serif; background:var(--cream-2); }

  /* ── Shell ── */
  .shell {
    max-width:380px; margin:24px auto; background:var(--cream);
    border:1px solid var(--rule-heavy); display:flex; flex-direction:column;
    height:calc(100vh - 48px); overflow:hidden;
  }

  /* ── Header ── */
  .shell-hd {
    background:var(--ink); color:var(--cream); padding:12px 16px;
    font-family:'EB Garamond',serif; font-size:1.1rem; font-style:italic; font-weight:700;
    display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
  }
  .shell-hd-sub { font-family:'DM Mono',monospace; font-size:.38rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--gold); margin-top:2px; }

  /* ── Tabs ── */
  .panel-tabs {
    display:flex; border-bottom:2px solid var(--ink); flex-shrink:0;
    background:var(--cream-2);
  }
  .panel-tab {
    flex:1; padding:9px 4px; border:none; background:transparent; cursor:pointer;
    font-family:'DM Mono',monospace; font-size:.42rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--text-muted); transition:color .15s,background .15s;
    border-right:1px solid var(--rule);
  }
  .panel-tab:last-child { border-right:none; }
  .panel-tab.active { background:var(--cream); color:var(--ink); font-weight:500; border-bottom:2px solid var(--cream); margin-bottom:-2px; }

  /* ── Body ── */
  .panel-body { flex:1; overflow-y:auto; }
  .tab-pane { display:none; }
  .tab-pane.active { display:block; }

  /* ── Claude's Cube ── */
  .cube-label {
    padding:6px 12px 2px; font-family:'DM Mono',monospace; font-size:.4rem;
    letter-spacing:.14em; text-transform:uppercase; color:var(--gold);
  }
  #panel-cube {
    display:grid; grid-template-columns:repeat(5,1fr);
    gap:3px; padding:6px 10px 4px;
  }
  .pcell {
    border-radius:5px; padding:6px 2px; text-align:center; cursor:pointer;
    transition:filter .15s,transform .12s; user-select:none; color:#fff;
  }
  .pcell:hover { filter:brightness(1.2); transform:scale(1.06); }
  .pcell.pactive { outline:2px solid var(--gold); outline-offset:1px; filter:brightness(1.25); }
  .pcell-icon { font-size:.9rem; display:block; line-height:1.2; }
  .pcell-label {
    font-size:.3rem; font-family:'DM Mono',monospace; letter-spacing:.04em;
    text-transform:uppercase; margin-top:1px; color:rgba(255,255,255,.88);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #cube-results { padding:0 8px; max-height:260px; overflow-y:auto; }

  /* ── Directory cards ── */
  .dir-card {
    display:flex; align-items:flex-start; gap:10px;
    padding:9px 12px; border-bottom:1px solid var(--rule);
    transition:background .15s;
  }
  .dir-card:hover { background:var(--cream-2); }
  .dir-name { font-family:'Source Serif 4',serif; font-size:.82rem; color:var(--ink); margin-bottom:1px; }
  .dir-addr { font-size:.67rem; color:var(--text-muted); margin-top:1px; }
  .dir-empty { padding:20px; text-align:center; font-size:.75rem; color:var(--text-muted); font-style:italic; }

  /* ── Child nav ── */
  .panel-child-nav {
    display:flex; border:1px solid var(--rule-heavy); overflow:hidden; margin-bottom:2px;
  }
  .pcn-link {
    flex:1; text-align:center; font-family:'DM Mono',monospace; font-size:.46rem;
    letter-spacing:.1em; text-transform:uppercase; color:var(--gold); text-decoration:none;
    padding:8px 2px; border-right:1px solid var(--rule-heavy);
    transition:background .15s,color .15s;
  }
  .pcn-link:last-child { border-right:none; }
  .pcn-link:hover { background:var(--ink); color:var(--cream); }

  /* ── CTA ── */
  .panel-cta {
    padding:13px 16px 18px; display:flex; flex-direction:column; gap:8px;
    border-top:2px solid var(--ink); flex-shrink:0; background:var(--cream);
  }
  .btn-primary {
    width:100%; padding:12px; background:var(--ink); color:var(--cream); border:none;
    font-family:'Source Serif 4',serif; font-size:.66rem; font-weight:600;
    letter-spacing:.18em; text-transform:uppercase; cursor:pointer;
  }

  /* ── Property stub tab ── */
  .prop-field { padding:10px 16px; border-bottom:1px solid var(--rule); }
  .prop-field-lbl { font-family:'DM Mono',monospace; font-size:.4rem; letter-spacing:.14em; text-transform:uppercase; color:var(--text-muted); margin-bottom:3px; }
  .prop-field-val { font-family:'Source Serif 4',serif; font-size:.88rem; color:var(--ink); }
</style>
</head>

</div><!-- /shell -->

let dirData = CONFIG[MARKET].mockData;
let pActiveCell = null, pActiveCellIdx = null;

/* ── Init ── */
function init() {
  /* Child nav */
  const nav = document.getElementById('child-nav');
  CONFIG[MARKET].childLinks.forEach(l => {
    const a = document.createElement('a');
    a.href = l.href; a.className = 'pcn-link'; a.textContent = l.label;
    nav.appendChild(a);
  });
  /* Cube */
  renderPanelCube();
}

function switchTab(name) {
  document.querySelectorAll('.panel-tab').forEach(t => {
    const m = (t.getAttribute('onclick') || '').match(/switchTab\('(\w+)'\)/);
    t.classList.toggle('active', !!m && m[1] === name);
  });
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
  document.getElementById('panel-body').scrollTop = 0;
  if (name === 'directory') {
    renderPanelCube();
    const res = document.getElementById('cube-results');
    if (res && !pActiveCellIdx) res.innerHTML = `<div class="dir-empty" style="font-size:.6rem">Tap a category above ↑</div>`;
  }
}

function renderPanelCube() {
  const cube = document.getElementById('panel-cube');
  if (!cube) return;
  cube.innerHTML = PCUBE_CATS.map((c, i) =>
    `<div class="pcell" style="background:${c.color}" onclick="selectPCell(this,${i})">` +
    `<span class="pcell-icon">${c.icon}</span>` +
    `<span class="pcell-label">${c.label}</span>` +
    `</div>`
  ).join('');
  if (pActiveCellIdx !== null) {
    const cells = cube.querySelectorAll('.pcell');
    if (cells[pActiveCellIdx]) { cells[pActiveCellIdx].classList.add('pactive'); pActiveCell = cells[pActiveCellIdx]; }
  }
}

function selectPCell(el, idx) {
  if (pActiveCell) pActiveCell.classList.remove('pactive');
  el.classList.add('pactive');
  pActiveCell = el; pActiveCellIdx = idx;
  const cat = PCUBE_CATS[idx];
  const res = document.getElementById('cube-results');
  if (!res) return;
  const words = cat.match.length ? cat.match : null;
  const filtered = words
    ? dirData.filter(b => words.some(w =>
        b.category.toLowerCase().includes(w) || b.name.toLowerCase().includes(w)
      ))
    : dirData;
  if (!filtered.length) {
    res.innerHTML = `<div class="dir-empty">No ${cat.label} listings found</div>`;
    return;
  }
  res.innerHTML = filtered.map(b => {
    const stars = b.rating  ? `<span style="font-size:.5rem;background:#FF6600;color:#fff;padding:1px 4px;border-radius:2px;font-weight:700">★${b.rating}</span>` : '';
    const yelp  = b.yelp_url? `<a href="${b.yelp_url}" target="_blank" onclick="event.stopPropagation()" style="font-size:.52rem;background:#B22234;color:#fff;padding:2px 5px;border-radius:2px;text-decoration:none;font-weight:600">Yelp</a>` : '';
    const waymo = b.waymo_url?`<a href="${b.waymo_url}" target="_blank" onclick="event.stopPropagation()" style="font-size:.52rem;background:#1A73E8;color:#fff;padding:2px 5px;border-radius:2px;text-decoration:none;font-weight:600">🚗 Waymo</a>` : '';
    return `<div class="dir-card"><div style="flex:1;min-width:0">` +
      `<div class="dir-name">${b.name}</div>` +
      (b.address ? `<div class="dir-addr">${b.address}</div>` : '') +
      `<div style="display:flex;gap:4px;margin-top:3px;align-items:center">${stars}${yelp}${waymo}</div>` +
      `</div></div>`;
  }).join('');
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
