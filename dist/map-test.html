<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    function initMap() {
      new google.maps.Map(document.getElementById('map'), {
        center: { lat: 34.0422, lng: -118.2637 },
        zoom:   16,
        tilt:   45,
        mapId:  '96844e6a7bb74a7d5514d3a5',
        mapTypeControl:    false,
        streetViewControl: false,
        fullscreenControl: false,
      });
    }
    window.initMap = initMap;
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD7UMA5ILPXv9QK2_gvxPVth30MavRd2WQ&callback=initMap&v=weekly&libraries=marker&map_ids=96844e6a7bb74a7d5514d3a5" async defer></script>
</body>
</html>
