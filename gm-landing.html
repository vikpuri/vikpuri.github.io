<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Requation — Real Estate Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@1,700&family=Raleway:wght@600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --white:      #FFFFFF;
      --cream:      #FAF8F4;
      --linen:      #F5F0E8;
      --sand:       #E8DDD0;
      --gold:       #C9A84C;
      --gold-light: #DFC07A;
      --text:       #2C2A26;
      --text-mid:   #6B6058;
      --text-muted: #9E9087;
      --border:     rgba(255,255,255,0.82);
      --marble:     rgba(240,236,228,0.92);
      --h:          60px;
      --yt:         90px;
    }

    html, body { height: 100%; overflow: hidden; background: var(--linen); }

    /* ── Header ───────────────────────────────────────── */
    header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--h); z-index: 100;
      background: linear-gradient(180deg, #ffffff 0%, var(--cream) 100%);
      border-bottom: 1px solid var(--sand);
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07), 0 1px 0 rgba(255,255,255,0.9) inset;
    }

    .logo-wrap { display: flex; align-items: center; cursor: pointer; }

    nav { display: flex; align-items: center; gap: 24px; }
    nav a, nav button {
      font-family: 'Source Serif 4', serif;
      font-size: .68rem; letter-spacing: .14em;
      text-transform: uppercase; color: var(--text-muted);
      text-decoration: none; background: none;
      border: none; cursor: pointer; transition: color .2s;
    }
    nav a:hover, nav button:hover { color: var(--text); }

    /* ── YT strip — thinner, white-washed ─────────────── */
    #yt-strip {
      position: fixed;
      top: var(--h); left: 0; right: 0;
      height: var(--yt); z-index: 90;
      background: var(--sand);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    /* Gloss sheen over the strip */
    #yt-strip::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.28) 0%, transparent 55%);
      pointer-events: none; z-index: 3;
    }

    #yt-strip iframe {
      position: absolute;
      /* Overshoot width slightly to eliminate any side letterbox bars */
      width: 104vw;
      height: calc(104vw * 9 / 16);
      top: 50%; left: -2vw;
      transform: translateY(-50%);
      border: none; pointer-events: none;
    }

    #yt-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        to right,
        rgba(245,240,232,0.42) 0%,
        transparent 12%,
        transparent 88%,
        rgba(245,240,232,0.42) 100%
      );
      cursor: pointer; z-index: 2;
    }

    #yt-label {
      position: absolute; bottom: 7px; left: 16px;
      font-family: 'Source Serif 4', serif;
      font-size: .55rem; letter-spacing: .16em; text-transform: uppercase;
      color: var(--text-mid);
    }

    /* ── Map ──────────────────────────────────────────── */
    #map {
      position: fixed;
      top: calc(var(--h) + var(--yt));
      left: 0; right: 0; bottom: 0;
    }

    /* ── State marker cards — glossy marble ───────────── */
    .state-card {
      position: relative; overflow: hidden;
      background: linear-gradient(155deg, rgba(255,255,255,0.97) 0%, rgba(250,248,244,0.92) 100%);
      border: 1.5px solid rgba(255,255,255,0.9);
      box-shadow:
        0 4px 20px rgba(0,0,0,0.10),
        0 1px 0 rgba(255,255,255,0.95) inset,   /* top gloss line */
        0 0 0 0.5px rgba(201,168,76,0.25);
      backdrop-filter: blur(16px);
      padding: 12px 16px; min-width: 155px;
      cursor: pointer;
      transform: translateY(-100%) translateY(-16px);
      transition: box-shadow .2s, transform .15s;
    }
    /* Gloss highlight */
    .state-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 45%;
      background: linear-gradient(180deg, rgba(255,255,255,0.55) 0%, transparent 100%);
      pointer-events: none;
    }
    .state-card:hover {
      box-shadow:
        0 10px 32px rgba(0,0,0,0.13),
        0 1px 0 rgba(255,255,255,0.95) inset,
        0 0 0 1px rgba(201,168,76,0.45);
      transform: translateY(-100%) translateY(-21px);
    }
    .sc-state   { font-size: .5rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
    .sc-name    { font-size: .78rem; font-weight: 600; color: var(--text); margin-bottom: 8px; line-height: 1.25; font-family: 'Source Serif 4', serif; }
    .sc-divider { border: none; border-top: 1px solid var(--sand); margin: 6px 0; }
    .sc-row     { display: flex; align-items: center; gap: 7px; margin-top: 4px; }
    .sc-icon    { font-size: .9rem; }
    .sc-text    { font-size: .58rem; color: var(--text-mid); letter-spacing: .03em; }

    /* ── Mobile ───────────────────────────────────────── */
    @media (max-width: 640px) {
      :root { --yt: 66px; }
      header { padding: 0 14px; }
      nav a { display: none; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo-wrap" onclick="goHome()">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" height="52" preserveAspectRatio="xMinYMid meet" aria-label="Requation">
      <defs><filter id="gb"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <text x="6" y="42" font-family="EB Garamond,Georgia,serif" font-size="46" font-weight="700" font-style="italic" fill="#B22234">r</text>
      <line x1="31" y1="76" x2="50" y2="41" stroke="#7A7A7A" stroke-width="5" stroke-linecap="round"/>
      <text x="56" y="88" font-family="Raleway,Arial,sans-serif" font-size="92" font-weight="600" fill="#4F6FB8">Σ</text>
      <text x="122" y="88" font-family="Raleway,Arial,sans-serif" font-size="24" font-weight="600" font-style="italic" fill="#D4A843" opacity="0.8" filter="url(#gb)" letter-spacing="2">quation</text>
    </svg>
  </div>
  <nav>
    <button onclick="goHome()">Home</button>
    <a href="/dtla">Los Angeles</a>
    <a href="/laveen">Arizona</a>
    <a href="#" onclick="openAbout()">About</a>
  </nav>
</header>

<!-- YT Monument strip -->
<div id="yt-strip">
  <iframe id="yt-frame"
    src="https://www.youtube.com/embed/HrxX9TBj2zY?autoplay=1&mute=1&loop=1&playlist=HrxX9TBj2zY&controls=0&showinfo=0&rel=0&modestbranding=1"
    allow="autoplay; encrypted-media"
    allowfullscreen>
  </iframe>
  <div id="yt-overlay" onclick="toggleSound()"></div>
  <div id="yt-label">▶ Neighborhood · Click to unmute</div>
</div>

<!-- Map -->
<div id="map"></div>

<script>
/* ── YT sound toggle ──────────────────────────────────── */
let muted = true;
function toggleSound() {
  const frame = document.getElementById('yt-frame');
  const label = document.getElementById('yt-label');
  muted = !muted;
  frame.src = frame.src.replace(muted ? 'mute=0' : 'mute=1', muted ? 'mute=1' : 'mute=0');
  label.textContent = muted ? '▶ Neighborhood · Click to unmute' : '🔊 Playing — Click to mute';
}

/* ── Locations ────────────────────────────────────────── */
const LOCATIONS = [
  { id: 'dtla',   state: 'California', name: 'South Park · DTLA',             lat: 34.0422,   lng: -118.2637, link: '/dtla',   wttr: 'Los+Angeles' },
  { id: 'laveen', state: 'Arizona',    name: 'Urban Farmhouse · Laveen',       lat: 33.3428,   lng: -112.1181, link: '/laveen', wttr: 'Laveen+AZ'   }
];

/* ── Constellation (evening sky, ~34°N) ───────────────── */
const CONS = { 1:'♉ Taurus',2:'♊ Gemini',3:'♊ Gemini',4:'♌ Leo',5:'♍ Virgo',6:'♏ Scorpius',7:'♐ Sagittarius',8:'♐ Sagittarius',9:'♑ Capricorn',10:'♓ Pisces',11:'♈ Aries',12:'♉ Taurus' };

async function fetchWeather(city) {
  try {
    const r = await fetch('https://wttr.in/' + city + '?format=%c+%t', { cache: 'no-store' });
    const t = (await r.text()).trim();
    return { icon: t.split(' ')[0] || '🌤', temp: t.split(' ')[1] || '–' };
  } catch { return { icon: '🌤', temp: '–' }; }
}

function makeCard(loc, wx) {
  const con = CONS[new Date().getMonth() + 1] || '✦ Orion';
  const el = document.createElement('div');
  el.className = 'state-card';
  el.innerHTML =
    '<div class="sc-state">' + loc.state + '</div>' +
    '<div class="sc-name">'  + loc.name  + '</div>' +
    '<hr class="sc-divider">' +
    '<div class="sc-row"><span class="sc-icon">' + wx.icon + '</span><span class="sc-text">' + wx.temp + ' · Now</span></div>' +
    '<div class="sc-row"><span class="sc-icon">' + con.split(' ')[0] + '</span><span class="sc-text">' + con.split(' ').slice(1).join(' ') + ' · Tonight</span></div>';
  el.addEventListener('click', () => location.href = loc.link);
  return el;
}

/* ── Map init ─────────────────────────────────────────── */
function initMap() {
  const map = new google.maps.Map(document.getElementById('map'), {
    center:      { lat: 35.8, lng: -114.0 },
    zoom:        3,
    mapId:       '96844e6a7bb74a7d5514d3a5',
    mapTypeControl:    false,
    streetViewControl: false,
    fullscreenControl: false,
    gestureHandling:   'greedy',
    zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_CENTER }
  });

  // Globe → US 3-stage cinematic reveal (final zoom keeps both CA + AZ markers in frame)
  setTimeout(() => map.moveCamera({ center: { lat: 36.8, lng: -113.5 }, zoom: 4.4, tilt: 20, heading: 352 }), 900);
  setTimeout(() => map.moveCamera({ center: { lat: 35.2, lng: -115.2 }, zoom: 5.4, tilt: 44, heading: 346 }), 2400);
  setTimeout(() => map.moveCamera({ center: { lat: 33.7, lng: -115.2 }, zoom: 5.9, tilt: 54, heading: 342 }), 4000);

  // Place markers after weather loads
  Promise.all(LOCATIONS.map(l => fetchWeather(l.wttr))).then(weathers => {
    LOCATIONS.forEach((loc, i) => {
      new google.maps.marker.AdvancedMarkerElement({
        map,
        position: { lat: loc.lat, lng: loc.lng },
        title:    loc.name,
        content:  makeCard(loc, weathers[i])
      });
    });
  });
}

function goHome() {
  location.href = '/';
}

function openAbout() {
  // placeholder — About modal can be added here
}

window.initMap = initMap;
</script>

<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD7UMA5ILPXv9QK2_gvxPVth30MavRd2WQ&callback=initMap&v=weekly&libraries=marker&map_ids=96844e6a7bb74a7d5514d3a5"
  async defer
></script>

</body>
</html>
