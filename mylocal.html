  <style>
    :root {
      --gold:#C9A84C; --gold-dim:rgba(201,168,76,.1); --gold-border:rgba(201,168,76,.35);
      --cream:#FAF8F4; --cream-2:#F4F1EB;
      --ink:#1C1C1C; --ink-3:#444;
      --rule:rgba(0,0,0,.12); --rule-heavy:rgba(0,0,0,.22);
      --text-muted:#666; --sand:#E8DDD0;
      --header-h:56px; --route-h:36px;
    }
    *,::before,::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { height:100%; margin:0; }
    body { background:#1a1a1a; color:var(--ink);
           font-family:'Source Serif 4',Georgia,serif; }

    /* Rule 1 — explicit dimensions, no fixed on #map */
    #map { width:100%; height:100%; }

    header {
      position:fixed; top:0; left:0; right:0; height:var(--header-h); z-index:100;
      background:rgba(255,255,255,.97); border-bottom:2px solid var(--ink);
      display:flex; align-items:center; justify-content:space-between; padding:0 20px;
    }
    .logo-wrap { display:flex; align-items:center; cursor:pointer; gap:10px; text-decoration:none; }
    .logo-addr { font-family:'DM Mono',monospace; font-size:.45rem; letter-spacing:.12em;
                 text-transform:uppercase; color:var(--text-muted);
                 border-left:1px solid var(--sand); padding-left:10px; }
    .header-tag { font-family:'DM Mono',monospace; font-size:.42rem; letter-spacing:.12em;
                  text-transform:uppercase; color:var(--gold);
                  background:var(--gold-dim); border:1px solid var(--gold-border);
                  padding:3px 8px; border-radius:2px; }

    /* ── Property pin ── */
    #prop-pin {
      position:fixed; width:42px; height:42px; border-radius:50%;
      background:var(--gold); border:3px solid #fff;
      box-shadow:0 2px 16px rgba(0,0,0,.5); z-index:20;
      cursor:pointer; display:none; transform:translate(-50%,-50%);
    }
    #prop-pin::after {
      content:''; position:absolute; inset:-7px; border-radius:50%;
      border:2px solid rgba(201,168,76,.5); animation:pulse 2s ease-out infinite;
    }
    @keyframes pulse { 0%{transform:scale(1);opacity:1} 100%{transform:scale(1.7);opacity:0} }

    /* ── Heart markers ── */
    .heart-pin {
      background:var(--gold); color:#fff; padding:5px 10px; border-radius:20px;
      font-family:'Source Serif 4',serif; font-size:11px; font-weight:600;
      cursor:pointer; white-space:nowrap; box-shadow:0 2px 12px rgba(0,0,0,.3);
      display:flex; align-items:center; gap:4px;
      transition:transform .15s, box-shadow .15s;
    }
    .heart-pin:hover { transform:scale(1.08); box-shadow:0 4px 18px rgba(0,0,0,.4); }

    /* ── Property label above pin ── */
    #prop-label {
      position:fixed; z-index:21; background:var(--ink); color:var(--cream);
      font-family:'DM Mono',monospace; font-size:.38rem; letter-spacing:.1em;
      text-transform:uppercase; padding:3px 8px; border-radius:2px;
      white-space:nowrap; display:none; transform:translate(-50%,-100%);
      pointer-events:none;
    }

    /* ── RPOI listing price pins ── */
    .rpoi-pin { background:#fff; border:2px solid var(--gold); border-radius:6px;
                padding:4px 8px; box-shadow:0 2px 10px rgba(0,0,0,.25);
                cursor:pointer; transition:transform .15s; min-width:58px; text-align:center; }
    .rpoi-pin:hover { transform:scale(1.08); }
    .rpoi-price { font-family:'DM Mono',monospace; font-size:11px; font-weight:500; color:var(--ink); line-height:1.3; }
    .rpoi-beds  { font-family:'DM Mono',monospace; font-size:9px; color:var(--text-muted); }

    /* ── Info card — slides up from bottom ── */
    #info-card {
      position:fixed; bottom:calc(var(--route-h) + 12px); left:50%;
      transform:translateX(-50%);
      width:min(420px, calc(100vw - 24px));
      background:var(--cream); border:2px solid var(--ink); border-radius:4px;
      box-shadow:0 12px 40px rgba(0,0,0,.35); z-index:200; display:none;
    }
    #info-card.open { display:flex; flex-direction:column; animation:slideUp .22s ease; }
    @keyframes slideUp { from{transform:translateX(-50%) translateY(16px);opacity:0} to{transform:translateX(-50%) translateY(0);opacity:1} }

    #card-close {
      position:absolute; top:9px; right:12px; background:none; border:none;
      cursor:pointer; font-size:1.1rem; color:var(--text-muted); z-index:1;
    }
    #card-close:hover { color:var(--ink); }

    #card-body { padding:16px 20px 8px; }
    #card-tag { font-family:'DM Mono',monospace; font-size:.38rem; letter-spacing:.14em;
                text-transform:uppercase; color:var(--gold); margin-bottom:2px; }
    #card-name { font-size:1.05rem; font-weight:600; color:var(--ink); margin-bottom:2px; }
    #card-addr { font-family:'DM Mono',monospace; font-size:.42rem; color:var(--text-muted);
                 letter-spacing:.06em; margin-bottom:10px; }
    #card-actions { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .card-btn {
      padding:8px 14px; border-radius:3px; font-family:'DM Mono',monospace;
      font-size:.42rem; letter-spacing:.1em; text-transform:uppercase;
      text-decoration:none; border:none; cursor:pointer;
    }
    .card-btn-view    { background:#2d2d2d; color:#f5e6c8; border:1px solid #c9a84c; }
    .card-btn-waymo   { background:#1A73E8; color:#fff; }
    .card-btn-yt      { background:#FF0000; color:#fff; }
    .card-btn-yelp    { background:#FF1A1A; color:#fff; }
    .yelp-pin { width:14px; height:14px; border-radius:50%; background:#FF6B35; border:2px solid #fff; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.4); }
    .card-btn-order   { background:var(--ink); color:var(--cream); }

    /* ── YouTube embed in card ── */
    #card-yt { width:100%; aspect-ratio:16/9; border:none; display:none; }

    /* ── Route nav ── */
    #route-nav {
      position:fixed; bottom:0; left:0; right:0; height:var(--route-h);
      background:rgba(255,255,255,.97); border-top:1.5px solid var(--rule-heavy);
      display:flex; align-items:center; justify-content:center; gap:6px; z-index:100;
      font-family:'DM Mono',monospace; font-size:.42rem; letter-spacing:.12em;
      text-transform:uppercase;
    }
    .route-stop { flex-shrink:0; padding:5px 11px; color:var(--text-muted); text-decoration:none; border:1px solid var(--rule-heavy); border-radius:2px; transition:all .15s; white-space:nowrap; }
    .route-stop:hover { background:var(--gold); color:#fff; border-color:var(--gold); }
    .route-stop.current { color:var(--ink); border-color:var(--gold); background:var(--gold-dim); }
    .route-arrow { display:none; }

    /* ── Counter badge ── */
    #heart-count {
      position:fixed; top:calc(var(--header-h) + 12px); left:12px; z-index:90;
      background:rgba(255,255,255,.92); border:1.5px solid var(--rule-heavy);
      border-radius:4px; padding:8px 14px;
      font-family:'DM Mono',monospace; font-size:.42rem; letter-spacing:.1em;
      text-transform:uppercase; color:var(--ink-3);
    }
    #heart-count strong { color:var(--gold); }
  </style>
</head>

<script>

let map, advMarker;

async function initMap() {
  const { Map }                 = await google.maps.importLibrary('maps');
  const { AdvancedMarkerElement } = await google.maps.importLibrary('marker');
  advMarker = AdvancedMarkerElement;

  // Rule 1 — #map has position:fixed + inset:0 = explicit dimensions
  map = new Map(document.getElementById('map'), {
    center:  CENTER,
    zoom:    17,
    tilt:    67.5,    // 3D buildings — requires zoom ≥ 17, mapId set
    heading: 200,
    mapId:  '96844e6a7bb74a7d5514d3a5',
    gestureHandling: 'greedy',
  });

  // Property pin — DOM overlay (only exception to billboard rule)
  initPropPin();

  // Load RPOI (Redfin), Yelp, then HEART favorites on top
  await loadRPOI();
  await loadYelp();
  loadHearts();
}

/* ── Property pin — click returns to /dtla ── */
function initPropPin() {
  const pin   = document.getElementById('prop-pin');
  const label = document.getElementById('prop-label');
  let pinActive = false;
  setTimeout(() => { pinActive = true; pin.style.display = 'block'; label.style.display = 'block'; }, 1200);
  pin.addEventListener('click', () => { window.location.href = '/dtla'; });

  map.addListener('bounds_changed', () => {
    if (!pinActive) return;
    const proj = map.getProjection();
    if (!proj) return;
    const point  = proj.fromLatLngToPoint(new google.maps.LatLng(CENTER.lat, CENTER.lng));
    const bounds = map.getBounds();
    if (!bounds) return;
    const ne    = proj.fromLatLngToPoint(bounds.getNorthEast());
    const sw    = proj.fromLatLngToPoint(bounds.getSouthWest());
    const scale = Math.pow(2, map.getZoom());
    const x = (point.x - sw.x) * scale;
    const y = (point.y - ne.y) * scale;
    pin.style.left   = x + 'px';
    pin.style.top    = y + 'px';
    label.style.left = x + 'px';
    label.style.top  = (y - 36) + 'px';
  });
}

/* ── Redfin RPOI listing pins ── */
async function loadRPOI() {
  try {
    const r = await fetch(
      `${SB_URL}/rest/v1/properties?zip=in.(${MYLOCAL_ZIPS.join(',')})&mls_status=eq.active&select=address,neighborhood,zip,lat,lng,price,beds,baths,sqft,redfin_url&order=price.asc&limit=200`,
      { headers: SB_HDRS }
    );
    const rows = await r.json();
    if (!Array.isArray(rows) || !rows.length) return;
    rows.forEach(p => {
      if (!p.lat || !p.lng) return;
      const el = document.createElement('div');
      el.className = 'rpoi-pin';
      const priceK = p.price ? '$' + Math.round(p.price / 1000) + 'K' : '—';
      el.innerHTML = `<div class="rpoi-price">${priceK}</div>${p.beds ? `<div class="rpoi-beds">${p.beds} bd</div>` : ''}`;
      const m = new advMarker({ position: { lat: p.lat, lng: p.lng }, map, content: el, title: p.address });
      m.addListener('click', () => {
        map.panTo({ lat: p.lat, lng: p.lng });
        showCard({
          tag:   p.neighborhood || 'DTLA Listing',
          name:  p.address,
          addr:  priceK + (p.beds ? ' · ' + p.beds + ' BD / ' + p.baths + ' BA' : ''),
          cat:   (p.sqft || '—') + ' sqft',
          waymo: 'https://waymo.com/waymo-one/?destination=' + encodeURIComponent(p.address),
          lat:   p.lat, lng: p.lng,
        });
        if (p.redfin_url) {
          const btn = Object.assign(document.createElement('a'), {
            className:'card-btn card-btn-view', textContent:'Redfin →',
            href:p.redfin_url, target:'_blank', rel:'noopener noreferrer',
          });
          document.getElementById('card-actions').appendChild(btn);
        }
      });
    });
  } catch(e) { console.warn('RPOI load failed:', e.message); }
}

/* ── Yelp businesses — live from Yelp Fusion API ── */
async function loadYelp() {
  try {
    const r = await fetch(`/api/yelp?lat=${CENTER.lat}&lng=${CENTER.lng}&radius=3000&rating=4`);
    const data = await r.json();
    if (!data.businesses?.length) return;
    data.businesses.forEach(b => {
      if (!b.coordinates?.latitude || !b.coordinates?.longitude) return;
      const el = document.createElement('div');
      el.className = 'yelp-pin';
      el.title = b.name + (b.rating ? ' ★' + b.rating : '');
      const m = new advMarker({ position: { lat: b.coordinates.latitude, lng: b.coordinates.longitude }, map, content: el, zIndex: 5 });
      m.addListener('click', () => {
        map.panTo({ lat: b.coordinates.latitude, lng: b.coordinates.longitude });
        showCard({
          tag:     (b.rating ? '★ ' + b.rating + ' · ' : '') + (b.categories?.[0]?.title || 'Yelp'),
          name:    b.name,
          addr:    b.location?.address1 || '',
          cat:     b.categories?.[0]?.title || '',
          waymo:   'https://waymo.com/waymo-one/?destination=' + encodeURIComponent(b.location?.address1 || b.name),
          lat:     b.coordinates.latitude, lng: b.coordinates.longitude,
        });
      });
    });
    console.log('Yelp loaded:', data.businesses.length, 'businesses');
  } catch(e) { console.warn('Yelp load failed:', e.message); }
}

/* ── ♥ Favorites ── */
function loadHearts() {
  HEARTS.forEach(h => {
    const el = document.createElement('div');
    el.className = 'heart-pin';
    el.innerHTML = `♥ ${h.name}`;

    const marker = new advMarker({
      position: { lat: h.lat, lng: h.lng },
      map,
      content: el,
      title: h.name,
      zIndex: 10,
    });

    marker.addListener('click', () => {
      // Rule 3 — panTo, never recreate map
      map.panTo({ lat: h.lat, lng: h.lng });
      showCard({
        tag:      '♥ Vik\'s Favorite' + (h.confirm ? ' · location TBC' : ''),
        name:     h.name,
        addr:     h.addr,
        cat:      h.cat,
        ytSearch: h.ytSearch,
        waymo:    'https://waymo.com/waymo-one/?destination=' + encodeURIComponent(h.addr),
        lat:      h.lat, lng: h.lng,
      });
    });
  });
}

/* ── Info card ── */
function showCard({ tag, name, addr, cat, ytSearch, waymo, lat, lng, yelpUrl, slug }) {
  document.getElementById('card-tag').textContent  = tag;
  document.getElementById('card-name').textContent = name;
  document.getElementById('card-addr').textContent = addr + (cat ? ' · ' + cat : '');

  const actEl = document.getElementById('card-actions');
  actEl.innerHTML = '';

  if (lat && lng) {
    const mBtn = Object.assign(document.createElement('button'), {
      className: 'card-btn card-btn-view',
      textContent: 'Map →',
    });
    mBtn.onclick = () => { map.panTo({ lat, lng }); map.setZoom(16); };
    actEl.appendChild(mBtn);
  }

  // Yelp data shown inline — no outbound link, rule: no new URL from within requation

  // YouTube — search link (plays on YouTube in new tab; inline embed below)
  const ytBtn = Object.assign(document.createElement('button'), {
    className: 'card-btn card-btn-yt',
    textContent: '▶ YouTube',
  });
  ytBtn.onclick = () => playYT(ytSearch);
  actEl.appendChild(ytBtn);

  if (waymo) {
    const wBtn = Object.assign(document.createElement('a'), {
      className: 'card-btn card-btn-waymo',
      textContent: 'Waymo →',
      href: waymo,
      target: '_blank',
      rel: 'noopener noreferrer',
    });
    actEl.appendChild(wBtn);
  }

  // Hide YT iframe until button clicked
  const ytFrame = document.getElementById('card-yt');
  ytFrame.style.display = 'none';
  ytFrame.src = '';

  const card = document.getElementById('info-card');
  card.classList.remove('open');
  void card.offsetWidth;
  card.classList.add('open');
}

async function playYT(query) {
  const ytFrame = document.getElementById('card-yt');
  ytFrame.style.display = 'block';
  ytFrame.src = '';
  let vid = 'rjBzXreFeWg'; // Pink Floyd — plays while search resolves
  try {
    const r = await fetch(`/api/youtube?q=${encodeURIComponent(query)}&maxResults=1`);
    if (r.ok) { const d = await r.json(); const v = (d.videos||[])[0]; if (v?.id) vid = v.id; }
  } catch(e) {}
  ytFrame.src = `https://www.youtube.com/embed/${vid}?autoplay=1&rel=0&modestbranding=1`;
}

function closeCard() {
  document.getElementById('info-card').classList.remove('open');
  document.getElementById('card-yt').src = '';
}

window.initMap = initMap;
</script>

  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD7UMA5ILPXv9QK2_gvxPVth30MavRd2WQ&callback=initMap&libraries=marker&v=weekly">
</script>
