<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MONUMENT Strip — Preview</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --header-h:68px;
    --monument-h:0px;
    --ink:#1A1A1A;
    --cream:#FAF8F4;
    --gold:#D4A843;
    --blue:#4F6FB8;
    --red:#B22234;
    --rule-heavy:rgba(26,26,26,.18);
  }
  body{background:#1a1a2e;font-family:'Source Serif 4',serif;overflow:hidden;height:100vh}

  /* ── MOCK HEADER ── */
  header{
    position:fixed;top:0;left:0;right:0;
    height:var(--header-h);z-index:200;
    background:var(--cream);
    border-bottom:1px solid var(--rule-heavy);
    display:flex;align-items:center;padding:0 16px;gap:16px;
  }
  .logo-mock{display:flex;align-items:center;flex:1}
  .logo-mock svg{height:44px;width:auto}
  header nav{display:flex;gap:20px;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase}
  header nav a{color:var(--ink);text-decoration:none;opacity:.7}

  /* ── MOCK MAP ── */
  #map-mock{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:radial-gradient(ellipse at 40% 60%, #1a2744 0%, #0d1117 70%);
    z-index:0;
  }
  .map-grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:40px 40px;
  }
  .map-label{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);
    font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.3em;
    text-transform:uppercase;color:rgba(255,255,255,.15)}

  /* ── MONUMENT STRIP ── */
  #monument-strip{
    position:fixed;
    top:var(--header-h);
    left:0;right:0;
    width:100%;
    height:clamp(160px, calc(100vw * 9 / 16), 240px);
    z-index:112;
    overflow:hidden;
    animation:monument-breathe 4s ease-in-out infinite;
  }

  @keyframes monument-breathe{
    0%,100%{box-shadow:0 0 0 0 rgba(0,191,255,0), inset 0 0 0 0 rgba(0,191,255,0)}
    50%{box-shadow:0 6px 40px rgba(0,191,255,.25), 0 0 0 1px rgba(0,191,255,.12)}
  }

  /* bottom fade into map */
  #monument-strip::after{
    content:'';position:absolute;bottom:0;left:0;right:0;height:48px;
    background:linear-gradient(transparent, rgba(13,17,23,.7));
    z-index:2;pointer-events:none;
  }

  .monument-scroll{
    display:flex;
    width:100%;height:100%;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scrollbar-width:none;
    -ms-overflow-style:none;
    cursor:grab;
  }
  .monument-scroll::-webkit-scrollbar{display:none}
  .monument-scroll:active{cursor:grabbing}

  .monument-card{
    flex:0 0 100%;
    scroll-snap-align:start;
    position:relative;
    height:100%;
    overflow:hidden;
  }

  .monument-thumb{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    filter:brightness(.85);
    transition:filter .4s ease;
  }
  .monument-card:hover .monument-thumb{filter:brightness(1)}

  /* play overlay */
  .monument-play{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.12);
    transition:background .3s;
    z-index:1;
  }
  .monument-card:hover .monument-play{background:rgba(0,0,0,.05)}
  .monument-play-btn{
    width:48px;height:48px;border-radius:50%;
    background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.7);
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(4px);
  }
  .monument-play-btn svg{margin-left:3px}

  /* label */
  .monument-label{
    position:absolute;bottom:56px;left:14px;z-index:3;
    display:flex;flex-direction:column;gap:3px;
  }
  .monument-tier{
    font-family:'DM Mono',monospace;font-size:.48rem;
    letter-spacing:.22em;text-transform:uppercase;
    color:rgba(0,191,255,.8);
    text-shadow:0 0 8px rgba(0,191,255,.5);
  }
  .monument-name{
    font-family:'DM Mono',monospace;font-size:.68rem;
    font-weight:500;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(255,255,255,.95);
    text-shadow:0 1px 6px rgba(0,0,0,.9);
  }

  /* dot indicators */
  .monument-dots{
    position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
    display:flex;gap:5px;z-index:4;
  }
  .monument-dot{
    width:5px;height:5px;border-radius:50%;
    background:rgba(255,255,255,.35);
    transition:background .3s, transform .3s;
    cursor:pointer;
  }
  .monument-dot.active{
    background:rgba(0,191,255,.9);
    transform:scale(1.3);
    box-shadow:0 0 6px rgba(0,191,255,.7);
  }

  /* ── INFO LABEL ── */
  .preview-info{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.7);backdrop-filter:blur(8px);
    color:rgba(255,255,255,.7);padding:8px 16px;border-radius:20px;
    font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.12em;
    text-align:center;z-index:200;white-space:nowrap;
  }
</style>
</head>
<body>

<!-- MOCK MAP -->
<div id="map-mock">
  <div class="map-grid"></div>
  <div class="map-label">MAP CANVAS</div>
</div>

<!-- MOCK HEADER -->
<header>
  <div class="logo-mock">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" preserveAspectRatio="xMinYMid meet" overflow="visible" aria-label="Requation">
      <defs><filter id="gb"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <text x="6" y="42" font-family="EB Garamond,Georgia,serif" font-size="46" font-weight="700" font-style="italic" fill="#B22234">r</text>
      <line x1="31" y1="76" x2="50" y2="41" stroke="#7A7A7A" stroke-width="5" stroke-linecap="round"/>
      <text x="56" y="88" font-family="Raleway,Arial,sans-serif" font-size="92" font-weight="600" fill="#4F6FB8">Σ</text>
      <text x="122" y="88" font-family="Raleway,Arial,sans-serif" font-size="24" font-weight="600" font-style="italic" fill="#D4A843" opacity="0.8" filter="url(#gb)" letter-spacing="2">quation</text>
    </svg>
  </div>
  <nav><a href="#">HOME</a><a href="#">ABOUT</a><a href="#">CONTACT</a></nav>
</header>

<!-- MONUMENT STRIP -->
<div id="monument-strip">
  <div class="monument-scroll" id="monument-scroll">

    <!-- LA LIVE -->
    <div class="monument-card">
      <img class="monument-thumb" src="https://img.youtube.com/vi/VKG3Lq2MRJI/maxresdefault.jpg" alt="LA Live"
           onerror="this.src='https://img.youtube.com/vi/VKG3Lq2MRJI/hqdefault.jpg'">
      <div class="monument-play">
        <div class="monument-play-btn">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><polygon points="5,2 16,9 5,16" fill="white"/></svg>
        </div>
      </div>
      <div class="monument-label">
        <span class="monument-tier">MONUMENT</span>
        <span class="monument-name">LA Live</span>
      </div>
    </div>

    <!-- LA CONVENTION CENTER -->
    <div class="monument-card">
      <img class="monument-thumb" src="https://img.youtube.com/vi/5qap5aO4i9A/maxresdefault.jpg" alt="LA Convention Center"
           onerror="this.src='https://img.youtube.com/vi/5qap5aO4i9A/hqdefault.jpg'">
      <div class="monument-play">
        <div class="monument-play-btn">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><polygon points="5,2 16,9 5,16" fill="white"/></svg>
        </div>
      </div>
      <div class="monument-label">
        <span class="monument-tier">MONUMENT</span>
        <span class="monument-name">LA Convention Center</span>
      </div>
    </div>

    <!-- THE BROAD -->
    <div class="monument-card">
      <img class="monument-thumb" src="https://img.youtube.com/vi/dQw4w9WgXcQ/maxresdefault.jpg" alt="The Broad"
           onerror="this.src='https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg'">
      <div class="monument-play">
        <div class="monument-play-btn">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><polygon points="5,2 16,9 5,16" fill="white"/></svg>
        </div>
      </div>
      <div class="monument-label">
        <span class="monument-tier">MONUMENT</span>
        <span class="monument-name">The Broad</span>
      </div>
    </div>

    <!-- MOCA -->
    <div class="monument-card">
      <img class="monument-thumb" src="https://img.youtube.com/vi/ZZ5LpwO-An4/maxresdefault.jpg" alt="MOCA"
           onerror="this.src='https://img.youtube.com/vi/ZZ5LpwO-An4/hqdefault.jpg'">
      <div class="monument-play">
        <div class="monument-play-btn">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><polygon points="5,2 16,9 5,16" fill="white"/></svg>
        </div>
      </div>
      <div class="monument-label">
        <span class="monument-tier">MONUMENT</span>
        <span class="monument-name">MOCA</span>
      </div>
    </div>

  </div>

  <!-- DOT INDICATORS -->
  <div class="monument-dots" id="monument-dots">
    <div class="monument-dot active" onclick="goToSlide(0)"></div>
    <div class="monument-dot" onclick="goToSlide(1)"></div>
    <div class="monument-dot" onclick="goToSlide(2)"></div>
    <div class="monument-dot" onclick="goToSlide(3)"></div>
  </div>
</div>

<div class="preview-info">MONUMENT preview — swipe or tap dots · never dismisses · z-index 112</div>

<script>
  const scroll = document.getElementById('monument-scroll');
  const dots = document.querySelectorAll('.monument-dot');

  function goToSlide(i){
    scroll.scrollTo({left: scroll.offsetWidth * i, behavior:'smooth'});
  }

  scroll.addEventListener('scroll', ()=>{
    const i = Math.round(scroll.scrollLeft / scroll.offsetWidth);
    dots.forEach((d,idx)=> d.classList.toggle('active', idx===i));
  });

  // auto-advance every 6s
  let current = 0;
  const total = dots.length;
  setInterval(()=>{
    current = (current + 1) % total;
    goToSlide(current);
  }, 6000);
</script>
</body>
</html>
